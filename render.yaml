services:
  - type: web
    name: yousafe-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        sync: false
      - key: MUNSIT_API_KEY
        sync: false
      - key: MUNSIT_BASE_URL
        sync: false
      - key: MUNSIT_STT_MODEL
        sync: false
      - key: MUNSIT_TTS_MODEL
        sync: false
      - key: MUNSIT_TTS_VOICE
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
